body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,#fff9dc50 0%,transparent 67%)}
.scene{width:min(100%,670px);margin:auto;padding:15px 22px 34px;text-align:center;position:relative}
h1{display:inline-block;margin:0;padding:9px 25px;font-size:clamp(24px,5.2vw,35px);background:linear-gradient(#fff6d9,#ffe8b4);border:4px solid #a16b3c;border-radius:25px;box-shadow:0 5px 0 #80522e,0 8px 18px #6d512a55;text-shadow:0 2px white}
.subtitle{font-weight:750;color:#745537;text-shadow:0 1px #fff9;margin:13px 0 16px}
.stats{display:flex;justify-content:space-between;align-items:center;padding:0 4%;margin-bottom:13px;gap:10px}
.stat{background:linear-gradient(#a66d3d,#704324);color:#fff4dc;border:3px solid #f2d09b;border-radius:14px;padding:8px 16px;font-size:15px;font-weight:850;box-shadow:0 4px 0 #684324,0 6px 12px #44301866}
.board-shell{position:relative;padding:14px;background:linear-gradient(135deg,#b17a42,#72441f 40%,#b77d43 72%,#77421f);border:4px solid #69431f;border-radius:24px;box-shadow:0 10px 0 #70431e,0 22px 35px #49351960,inset 0 0 0 4px #e3af6b}
.board-shell:before{content:"🌿 🌸 🍃";position:absolute;left:10px;right:10px;top:-21px;text-align:center;font-size:24px;letter-spacing:28px;pointer-events:none;filter:drop-shadow(0 2px 2px #61452e)}
.board{position:relative;aspect-ratio:1;background:#f5e7c8;border-radius:9px;overflow:hidden;touch-action:none;isolation:isolate}
.cell{position:absolute;width:16.6666667%;height:16.6666667%;border:1px solid #d6b99a;background:linear-gradient(135deg,#fff2d9,#f1dfc4)}
.cell:nth-child(3n){background:linear-gradient(135deg,#fff0d2,#e9d6b8)}
.piece{position:absolute;z-index:4;touch-action:none;user-select:none;-webkit-user-select:none;transform:translate(var(--dx,0px),var(--dy,0px));filter:drop-shadow(0 5px 3px #654c3570);will-change:transform}
.piece img{position:absolute;display:block;object-fit:fill;max-width:none;pointer-events:none;user-select:none;-webkit-user-drag:none;width:100%;height:100%;inset:0}
.piece.held{z-index:10;filter:drop-shadow(0 12px 7px #513b2788) brightness(1.07)}
.piece.bird img{animation:breathe 2.6s ease-in-out infinite}
.piece.held img{animation:none}
.piece:focus-visible{outline:3px solid #f8ca4c}
.exit-gap{position:absolute;right:-5px;top:calc(33.3333% + 2px);height:calc(16.6667% - 4px);width:23px;background:linear-gradient(90deg,#f4e3be,#ffed9b);z-index:6;box-shadow:0 0 23px #ffdc54}
.exit-beam{position:absolute;right:-13px;top:33.3333%;height:16.6667%;width:36px;z-index:7;pointer-events:none;background:linear-gradient(90deg,#fff4c300,#fff2a0bd);animation:glow 1.6s ease-in-out infinite}
.exit-arrow{position:absolute;right:-51px;top:41.6667%;transform:translateY(-50%);z-index:9;font-size:38px;font-weight:1000;color:#ffed64;text-shadow:0 0 4px #6b8c37,0 0 14px #fffb9d,0 2px #a36d35;animation:arrowPulse 1.3s ease-in-out infinite;pointer-events:none}
.exit-label{position:absolute;right:-39px;top:calc(33.3333% - 28px);z-index:9;color:#fffbe5;text-shadow:0 2px 4px #6a462d,0 0 9px #6a462d;font-weight:900;font-size:13px;pointer-events:none}
.board-shell{margin-right:34px}
.board-shell .exit-gap{right:-6px;top:calc(14px + (100% - 28px)*.33333);height:calc((100% - 28px)/6);width:18px;background:linear-gradient(90deg,#fff0bd,#f9d978);border-radius:0;box-shadow:0 0 22px #ffe372;z-index:8}
.board-shell .exit-beam{right:-30px;top:calc(14px + (100% - 28px)*.33333);height:calc((100% - 28px)/6);width:45px}
.board-shell .exit-arrow{right:-43px;top:calc(14px + (100% - 28px)*.416667)}
.board-shell .exit-label{right:-33px;top:calc(14px + (100% - 28px)*.33333 - 26px)}
.controls{display:flex;gap:12px;justify-content:center;margin-top:23px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;touch-action:manipulation;font-size:15px;font-weight:900;color:#694323;padding:13px 18px;border-radius:14px;border:3px solid #ac7b45;background:linear-gradient(#fff6d9,#f2d2a3);box-shadow:0 5px 0 #97663b,0 9px 13px #68432155;transition:transform .13s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #97663b}
.message{margin:22px auto 0;background:#79502dcc;color:#fff6dd;border-radius:15px;padding:10px 15px;max-width:90%;font-weight:750}
.footer{margin:13px;font-size:12px;color:#6a573e;font-weight:650;text-shadow:0 1px #fff}
.petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}.petal{position:absolute;top:-40px;animation:petalFall linear infinite;opacity:.7}
.spark{position:absolute;pointer-events:none;z-index:20;font-size:21px;animation:spark .8s ease-out forwards;color:#fff3a1;text-shadow:0 1px #d99464}
.celebration{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#2e4c357c;backdrop-filter:blur(6px);padding:20px}.celebration.hidden{display:none}
.win-card{position:relative;width:min(95vw,440px);padding:26px 20px 30px;border:6px solid #b27a44;border-radius:32px;background:radial-gradient(circle at 50% 25%,#fffce2,#f8dfac 72%,#eac58c);box-shadow:0 20px 60px #24190b88,inset 0 0 0 4px #fff8d3;overflow:hidden}
.win-title{font-size:clamp(27px,7vw,37px);font-weight:1000;color:#a26836;text-shadow:0 2px white;position:relative;z-index:2}
.win-birds{position:relative;z-index:2;width:min(75%,270px);margin:5px auto;animation:winBounce 1.25s ease-in-out infinite}
.win-birds img{width:100%;display:block;filter:none!important;mix-blend-mode:normal}
.win-sub{position:relative;z-index:2;font-weight:800;color:#78543d;margin:10px}
.win-card button{position:relative;z-index:3}
.rays{position:absolute;inset:-50%;background:repeating-conic-gradient(#ffef9e77 0deg 12deg,transparent 12deg 24deg);animation:spin 16s linear infinite}
.confetti{position:fixed;top:-30px;z-index:60;pointer-events:none;animation:confettiFall 3s linear forwards}
.escape{animation:escape .75s ease-in forwards!important;z-index:12}
@keyframes breathe{50%{transform:translateY(-3px) scale(1.03)}}@keyframes glow{50%{opacity:.45}}@keyframes arrowPulse{50%{transform:translate(7px,-50%) scale(1.1)}}@keyframes petalFall{to{transform:translate(80px,110vh) rotate(440deg)}}@keyframes spark{to{transform:translate(var(--sx),var(--sy)) rotate(180deg);opacity:0}}@keyframes winBounce{50%{transform:translateY(-22px) rotate(4deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes confettiFall{to{transform:translate(var(--cx),110vh) rotate(750deg)}}@keyframes escape{to{transform:translate(150px,-40px) rotate(12deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.petal,.win-birds,.rays,.piece.bird img{animation:none}}
</style></head><body><div class="petals" id="petals"></div><main class="scene">
<h1>🌸 시마에나가의 숲길 🌿</h1><div class="subtitle">두 마리가 함께 집으로 돌아가요 ♡</div>

<div class="controls"><button id="undo">↶ 되돌리기</button><button id="reset">⟳ 다시 시작</button><button id="select">☷ 숲길 선택</button></div>
<div class="message" id="msg">🌼 나무와 풀잎을 움직여 출구로 가요!</div><div class="footer">시간 제한 없음 · 실패 없음 · 블록은 자기 방향으로만 이동</div>

$('#win-bird').src=art.bird;
function note(f=530){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch(e){}}
function cellsExcept(id){const set=new Set();for(const p of pieces){if(p.id===id)continue;for(let i=0;i<p.n;i++)set.add((p.x+(p.d==='h'?i:0))+','+(p.y+(p.d==='v'?i:0)))}return set}
function valid(p,x,y){if(x<0||y<0||x+(p.d==='h'?p.n:1)>6||y+(p.d==='v'?p.n:1)>6)return false;const taken=cellsExcept(p.id);for(let i=0;i<p.n;i++)if(taken.has((x+(p.d==='h'?i:0))+','+(y+(p.d==='v'?i:0))))return false;return true}
function limits(p){let min=0,max=0;while(valid(p,p.x+(p.d==='h'?min-1:0),p.y+(p.d==='v'?min-1:0)))min--;while(valid(p,p.x+(p.d==='h'?max+1:0),p.y+(p.d==='v'?max+1:0)))max++;return {min,max}}
function spark(x,y,count=9){for(let i=0;i<count;i++){const e=document.createElement('span');e.className='spark';e.textContent=i%3?'✦':'🌸';e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--sx',Math.round((Math.random()-.5)*100)+'px');e.style.setProperty('--sy',Math.round((Math.random()-.5)*90)+'px');board.append(e);setTimeout(()=>e.remove(),850)}}
function render(){board.innerHTML='';for(let y=0;y<6;y++)for(let x=0;x<6;x++){const cell=document.createElement('div');cell.className='cell';cell.style.left=x/6*100+'%';cell.style.top=y/6*100+'%';board.append(cell)}
for(const p of pieces){const el=document.createElement('div');el.className='piece '+p.t;el.dataset.id=p.id;el.style.left=p.x/6*100+'%';el.style.top=p.y/6*100+'%';el.style.width=(p.d==='h'?p.n:1)/6*100+'%';el.style.height=(p.d==='v'?p.n:1)/6*100+'%';
const img=document.createElement('img');img.src=art[p.t];img.alt=p.t==='bird'?'시마에나가 부부':p.t==='log'?'통나무':'풀잎';
if(p.d==='v'){img.style.width=p.n*100+'%';img.style.height=100/p.n+'%';img.style.left='50%';img.style.top='50%';img.style.transform='translate(-50%,-50%) rotate(90deg)'}el.append(img);
el.addEventListener('pointerdown',e=>{if(won||drag)return;e.preventDefault();const unit=board.clientWidth/6,lim=limits(p);drag={id:p.id,pointer:e.pointerId,el,start:p.d==='h'?e.clientX:e.clientY,unit,lim,offset:0};el.classList.add('held');el.style.transition='none';try{el.setPointerCapture(e.pointerId)}catch(_){}});
el.addEventListener('pointermove',e=>{if(!drag||drag.id!==p.id||drag.pointer!==e.pointerId)return;const raw=(p.d==='h'?e.clientX:e.clientY)-drag.start;const v=Math.max(drag.lim.min*drag.unit,Math.min(drag.lim.max*drag.unit,raw));drag.offset=v;el.style.setProperty('--dx',p.d==='h'?v+'px':'0px');el.style.setProperty('--dy',p.d==='v'?v+'px':'0px')});
function release(e,cancel=false){if(!drag||drag.id!==p.id||drag.pointer!==e.pointerId)return;const d=drag;drag=null;el.classList.remove('held');const step=cancel?0:Math.max(d.lim.min,Math.min(d.lim.max,Math.round(d.offset/d.unit)));const previous=d.offset;
if(step){history.push(clone(pieces));if(p.d==='h')p.x+=step;else p.y+=step;moves++;el.style.left=p.x/6*100+'%';el.style.top=p.y/6*100+'%';note(p.t==='bird'?790:490);spark((p.x+(p.d==='h'?p.n/2:.5))*d.unit,(p.y+(p.d==='v'?p.n/2:.5))*d.unit);updateStats()}
const residual=previous-step*d.unit;el.style.setProperty('--dx',p.d==='h'?residual+'px':'0px');el.style.setProperty('--dy',p.d==='v'?residual+'px':'0px');
requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transition='transform .16s ease-out';el.style.setProperty('--dx','0px');el.style.setProperty('--dy','0px')}));
if(step&&p.id==='bird'&&p.x===4){won=true;setTimeout(clearStage,260)}}
el.addEventListener('pointerup',e=>release(e));el.addEventListener('pointercancel',e=>release(e,true));board.append(el)}
updateStats()}
function updateStats(){$('#stage').textContent='🌼 숲길 '+(level+1);$('#moves').textContent='이동 '+moves+'회'}
function load(){pieces=clone(layouts[level%layouts.length]);history=[];moves=0;won=false;drag=null;win.classList.add('hidden');$('#msg').textContent='🌼 나무와 풀잎을 움직여 출구로 가요!';render()}
function clearStage(){const b=board.querySelector('[data-id="bird"]');if(b)b.classList.add('escape');$('#msg').textContent='🌸 시마에나가 부부가 탈출했어요!';note(660);setTimeout(()=>note(880),130);setTimeout(()=>note(1100),260);setTimeout(()=>{win.classList.remove('hidden');for(let i=0;i<34;i++){const e=document.createElement('span');e.className='confetti';e.textContent=i%3?'🌸':'✨';e.style.left=Math.random()*100+'%';e.style.setProperty('--cx',Math.random()*180-90+'px');e.style.animationDelay=Math.random()*.65+'s';win.append(e);setTimeout(()=>e.remove(),3700)}},620)}
$('#undo').onclick=()=>{if(!history.length||drag)return;pieces=history.pop();moves=Math.max(0,moves-1);won=false;win.classList.add('hidden');render();note(380)};
$('#reset').onclick=load;$('#next').onclick=()=>{level++;load()};
$('#select').onclick=()=>{const answer=prompt('숲길 번호를 입력하세요 (1~3)',String(level%3+1));if(answer===null)return;const n=Number(answer);if(Number.isInteger(n)&&n>=1&&n<=3){level=n-1;load()}};
const petalLayer=$('#petals');for(let i=0;i<15;i++){const e=document.createElement('span');e.className='petal';e.textContent=i%3?'🌸':'🍃';e.style.left=Math.random()*100+'%';e.style.fontSize=(13+Math.random()*13)+'px';e.style.animationDuration=(9+Math.random()*13)+'s';e.style.animationDelay=(-Math.random()*19)+'s';petalLayer.append(e)}
load();
</script></body></html>
