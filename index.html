<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>시마에나가의 숲길</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f1;color:#42584a;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;display:flex;justify-content:center}.app{width:min(100%,520px);padding:20px 15px;text-align:center}h1{font-size:25px;margin:12px 0 4px}.sub{font-size:13px;color:#7a9280}.stats{display:flex;justify-content:space-between;margin:22px 8px 12px;font-size:14px}.board{position:relative;width:100%;aspect-ratio:1;background:#dbead7;border:8px solid #c4d9bd;border-radius:22px;touch-action:none;overflow:visible;box-shadow:0 10px 25px #abc3a64d}.cell{position:absolute;width:16.6667%;height:16.6667%;border:1px solid #cbdcc5;background:#f5faf0}.piece{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:15px;border:2px solid #ffffffaa;touch-action:none;user-select:none;cursor:grab;box-shadow:0 3px 7px #617c6540;transition:left .12s,top .12s}.piece:active{cursor:grabbing;filter:brightness(1.04)}.bird{background:#ffe6c7;gap:1px;font-size:clamp(19px,7vw,37px)}.log{background:#b68c66;color:#624628;font-size:clamp(19px,6vw,34px)}.leaf{background:#a7d3a1;color:#38764b;font-size:clamp(19px,6vw,34px)}.exit{position:absolute;right:-30px;top:33.333%;height:16.6667%;display:flex;align-items:center;color:#659e72;font-size:25px}.controls{display:flex;gap:9px;margin:22px 0 12px}.controls button,.next{flex:1;border:0;border-radius:13px;background:#d8e8d5;padding:13px;font-weight:700;color:#48654c;font-size:14px}.next{background:#7db88b;color:white;width:100%;margin-top:8px}.message{min-height:48px;font-size:14px;margin:14px 0;color:#6b806e}.win{background:#e5f3df;border-radius:14px;padding:16px;margin-top:15px}.hidden{display:none}.preview-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;padding:20px;color:#56735d}.preview-fallback small{font-size:12px;line-height:1.6}.footer{font-size:12px;color:#92a296;margin-top:20px}</style></head><body><main class="app"><h1>🐦 시마에나가의 숲길</h1><div class="sub">두 마리가 함께 집으로 돌아갈 수 있게 도와주세요</div><div class="stats"><span id="stage"></span><span id="moves"></span></div><div id="board" class="board"><div class="preview-fallback">게임을 불러오는 중입니다…<small>화면이 그대로라면 파일 미리보기 대신 웹사이트에서 실행해야 합니다.</small></div></div><div class="controls"><button id="undo">↶ 되돌리기</button><button id="reset">⟳ 다시 시작</button></div><div id="msg" class="message">통나무와 풀잎을 밀어 길을 열어주세요.</div><div id="win" class="win hidden">🌸 함께 탈출했어요!<br><button class="next" id="next">다음 숲길 →</button></div><div class="footer">시간 제한 없음 · 실패 없음 · 터치와 마우스 지원</div></main><script>
const layouts=[
[{id:'bird',t:'bird',x:0,y:2,d:'h',n:2},{id:'a',t:'log',x:3,y:1,d:'v',n:3},{id:'b',t:'leaf',x:4,y:2,d:'v',n:2},{id:'c',t:'leaf',x:0,y:0,d:'h',n:2},{id:'d',t:'log',x:0,y:5,d:'h',n:3}],
[{id:'bird',t:'bird',x:0,y:2,d:'h',n:2},{id:'a',t:'log',x:2,y:1,d:'v',n:3},{id:'b',t:'leaf',x:3,y:2,d:'v',n:2},{id:'c',t:'leaf',x:4,y:1,d:'v',n:2},{id:'d',t:'log',x:0,y:5,d:'h',n:3}],
[{id:'bird',t:'bird',x:0,y:2,d:'h',n:2},{id:'a',t:'leaf',x:2,y:2,d:'v',n:2},{id:'b',t:'log',x:3,y:1,d:'v',n:3},{id:'c',t:'leaf',x:4,y:2,d:'v',n:2},{id:'d',t:'leaf',x:0,y:0,d:'h',n:2},{id:'e',t:'log',x:0,y:5,d:'h',n:3}]
];let level=0,pieces=[],history=[],moves=0,won=false,drag=null;const board=document.querySelector('#board');const copy=x=>JSON.parse(JSON.stringify(x));function load(){pieces=copy(layouts[level%layouts.length]);history=[];moves=0;won=false;document.querySelector('#win').classList.add('hidden');document.querySelector('#msg').textContent='통나무와 풀잎을 밀어 길을 열어주세요.';draw()}function occupied(except){let s=new Set();pieces.forEach(p=>{if(p.id===except)return;for(let k=0;k<p.n;k++)s.add(`${p.x+(p.d==='h'?k:0)},${p.y+(p.d==='v'?k:0)}`)});return s}function valid(p,x,y){if(x<0||y<0||x+(p.d==='h'?p.n:1)>6||y+(p.d==='v'?p.n:1)>6)return false;const o=occupied(p.id);for(let k=0;k<p.n;k++)if(o.has(`${x+(p.d==='h'?k:0)},${y+(p.d==='v'?k:0)}`))return false;return true}function move(id,delta){if(won)return;const p=pieces.find(z=>z.id===id);if(!p)return;let sign=Math.sign(delta),steps=Math.abs(delta),nx=p.x,ny=p.y;for(let k=0;k<steps;k++){let tx=nx+(p.d==='h'?sign:0),ty=ny+(p.d==='v'?sign:0);if(!valid(p,tx,ty))break;nx=tx;ny=ty}if(nx===p.x&&ny===p.y)return;history.push(copy(pieces));p.x=nx;p.y=ny;moves++;if(p.id==='bird'&&p.x===4){won=true;document.querySelector('#win').classList.remove('hidden');document.querySelector('#msg').textContent='두 마리가 나란히 숲으로 돌아갔어요.'}draw()}function draw(){board.innerHTML='';for(let y=0;y<6;y++)for(let x=0;x<6;x++){let c=document.createElement('div');c.className='cell';c.style.left=x*100/6+'%';c.style.top=y*100/6+'%';board.append(c)}let ex=document.createElement('div');ex.className='exit';ex.textContent='➜';board.append(ex);pieces.forEach(p=>{let el=document.createElement('div');el.className='piece '+p.t;el.style.left=p.x*100/6+'%';el.style.top=p.y*100/6+'%';el.style.width=(p.d==='h'?p.n:1)*100/6+'%';el.style.height=(p.d==='v'?p.n:1)*100/6+'%';el.textContent=p.t==='bird'?'🐦🐦':p.t==='log'?'🪵':'🌿';el.addEventListener('pointerdown',e=>{if(won)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}drag={id:p.id,start:p.d==='h'?e.clientX:e.clientY,unit:board.clientWidth/6};});el.addEventListener('pointerup',e=>{if(!drag||drag.id!==p.id)return;const distance=(p.d==='h'?e.clientX:e.clientY)-drag.start;const step=Math.round(distance/drag.unit);drag=null;if(step)move(p.id,step)});el.addEventListener('pointercancel',()=>drag=null);board.append(el)});document.querySelector('#stage').textContent='숲길 '+(level+1);document.querySelector('#moves').textContent='이동 '+moves+'회'}document.querySelector('#undo').onclick=()=>{if(!history.length)return;pieces=history.pop();moves--;won=false;document.querySelector('#win').classList.add('hidden');document.querySelector('#msg').textContent='통나무와 풀잎을 밀어 길을 열어주세요.';draw()};document.querySelector('#reset').onclick=load;document.querySelector('#next').onclick=()=>{level++;load()};load();
</script></body></html>
