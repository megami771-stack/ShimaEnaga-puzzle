<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>시마에나가의 숲길</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8f1;color:#42584a;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;display:flex;justify-content:center}.app{width:min(100%,520px);padding:20px 15px;text-align:center}h1{font-size:25px;margin:12px 0 4px}.sub{font-size:13px;color:#7a9280}.stats{display:flex;justify-content:space-between;margin:22px 8px 12px;font-size:14px}.board{position:relative;width:100%;aspect-ratio:1;background:#dbead7;border:8px solid #c4d9bd;border-radius:22px;touch-action:none;overflow:hidden;box-shadow:0 10px 25px #abc3a64d}.cell{position:absolute;width:16.6667%;height:16.6667%;border:1px solid #cbdcc5;background:#f5faf0}.piece{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:15px;border:2px solid #ffffffaa;touch-action:none;user-select:none;cursor:grab;box-shadow:0 3px 7px #617c6540;transition:left .12s,top .12s}.piece:active{cursor:grabbing;filter:brightness(1.04)}.bird,.log,.leaf{background:transparent;border:0;box-shadow:none;overflow:visible}.piece img{width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;filter:drop-shadow(0 3px 2px #536b4b44)}.piece.vertical img{position:absolute;max-width:none;max-height:none}.piece{overflow:visible}.bird img{object-fit:contain}.exit{position:absolute;right:-30px;top:33.333%;height:16.6667%;display:flex;align-items:center;color:#659e72;font-size:25px}.controls{display:flex;gap:9px;margin:22px 0 12px}.controls button,.next{flex:1;border:0;border-radius:13px;background:#d8e8d5;padding:13px;font-weight:700;color:#48654c;font-size:14px}.next{background:#7db88b;color:white;width:100%;margin-top:8px}.message{min-height:48px;font-size:14px;margin:14px 0;color:#6b806e}.win{background:#e5f3df;border-radius:14px;padding:16px;margin-top:15px}.hidden{display:none}.preview-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:16px;padding:20px;color:#56735d}.preview-fallback small{font-size:12px;line-height:1.6}.footer{font-size:12px;color:#92a296;margin-top:20px}
/* v0.3 lively animation */
body{background:radial-gradient(ellipse at 50% 0%,#fff9eb 0%,#eff8ed 48%,#e8f2e8 100%);min-height:100vh}
.app{position:relative;padding-bottom:32px}h1{color:#46694f;text-shadow:0 2px #fff;font-weight:900;letter-spacing:-.8px}.sub{line-height:1.7}
.board{background:linear-gradient(145deg,#e4efda,#cfe6ce);border:9px solid #bfd5b5;box-shadow:0 13px 0 #a8c49e,0 24px 40px #698c6b40,inset 0 0 22px #fff9;isolation:isolate}
.cell{background:linear-gradient(145deg,#fcfff7,#eaf5e5);border:1px solid #cddfc6}.cell:nth-child(odd){background:linear-gradient(145deg,#f7fff0,#e4f2df)}
.piece{z-index:2;transition:left .27s cubic-bezier(.16,1.15,.35,1),top .27s cubic-bezier(.16,1.15,.35,1),filter .2s;transform:translate(var(--dragx,0px),var(--dragy,0px));will-change:left,top,transform;filter:drop-shadow(0 6px 4px #405d3540)}
.piece img{filter:drop-shadow(0 5px 4px #405d3540)}
.piece.bird{z-index:4;animation:birdBreath 2.5s ease-in-out infinite}.piece.bird img{animation:birdBob 2.5s ease-in-out infinite}
.piece.held{z-index:7;transition:none;filter:drop-shadow(0 13px 8px #36552c77) brightness(1.08) saturate(1.16)}.piece.held img{animation:none!important;filter:drop-shadow(0 5px 4px #405d3540)}
.piece.moving{filter:drop-shadow(0 7px 5px #405d3540)}.piece.moving img{animation:none!important}.piece.bump{animation:bump .22s ease-out!important}.piece.spawn{animation:spawn .45s backwards;animation-delay:var(--delay,0ms)}
.piece.escaping{z-index:10;animation:escape .9s cubic-bezier(.3,.1,.7,1) forwards!important}.piece.escaping img{animation:none!important}
.exit{right:-32px;color:#5ca97a;font-size:20px;font-weight:900;animation:exitPulse 1.6s ease-in-out infinite;text-shadow:0 0 8px #eaffae}
.controls button,.next,.celebrate-next{box-shadow:0 4px 0 #b6cdb2,0 7px 14px #8caf8a30;transition:transform .14s,filter .14s}.controls button:active,.next:active,.celebrate-next:active{transform:translateY(3px);box-shadow:0 1px 0 #b6cdb2}
.spark{position:absolute;z-index:15;pointer-events:none;font-size:21px;color:#f8c966;text-shadow:0 1px white;animation:sparkFly .8s ease-out forwards}.spark.flower{color:#f49db2}
.board.cleared{box-shadow:0 0 0 6px #f8e4a3,0 0 45px #f8d67b,0 13px 0 #a8c49e}
.celebration{position:fixed;inset:0;z-index:50;background:#1c3d2b77;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px;overflow:hidden;backdrop-filter:blur(5px)}.celebration.hidden{display:none}.celebration.pop{animation:fadeIn .4s ease both}
.celebrate-birds{width:min(82vw,350px);position:relative;z-index:2;filter:none;animation:happyBirds 1.5s ease-in-out infinite}.celebrate-birds img{display:block;width:100%;filter:none!important;mix-blend-mode:normal;opacity:1;animation:happyWiggle 1.1s ease-in-out infinite}
.celebrate-title{position:relative;z-index:2;font-size:clamp(28px,7vw,40px);font-weight:1000;color:#fff7cf;text-shadow:0 3px 0 #c88f67,0 6px 15px #31583e;animation:titlePop .75s cubic-bezier(.2,1.5,.3,1) both}.celebrate-sub{z-index:2;color:white;font-weight:800;font-size:16px;text-shadow:0 2px 8px #345}.celebrate-next{z-index:3;margin-top:12px;background:linear-gradient(135deg,#fbe8a3,#f4b9bb);border:3px solid white;border-radius:25px;padding:15px 35px;font-size:18px;font-weight:900;color:#5c6348}
.rays{position:absolute;width:85vmax;height:85vmax;border-radius:50%;background:repeating-conic-gradient(from 0deg,#fff4a130 0deg 12deg,transparent 12deg 24deg);animation:spin 17s linear infinite;opacity:.55}
.confetti{position:absolute;top:-25px;width:10px;height:18px;border-radius:3px;animation:confettiFall 2.3s linear forwards;z-index:1}
@keyframes birdBreath{0%,100%{filter:drop-shadow(0 4px 4px #46644c30)}50%{filter:drop-shadow(0 9px 8px #46644c45)}}
@keyframes birdBob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.035)}}
@keyframes slideBounce{0%{transform:scale(.96) rotate(-2deg)}45%{transform:scale(1.09) rotate(2deg)}75%{transform:scale(.98) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes bumpVertical{0%,100%{transform:translateY(0)}35%{transform:translateY(-4px)}65%{transform:translateY(3px)}}.piece.bump-vertical{animation:bumpVertical .22s ease-out!important}@keyframes bump{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}65%{transform:translateX(4px)}}
@keyframes spawn{from{opacity:0;scale:.7;filter:blur(4px)}to{opacity:1;scale:1;filter:blur(0)}}
@keyframes escape{0%{transform:translateX(0) rotate(0)}25%{transform:translateX(0) translateY(-10px) rotate(-5deg)}65%{transform:translateX(65px) translateY(-25px) rotate(6deg)}100%{transform:translateX(180px) translateY(-65px) rotate(12deg);opacity:0}}
@keyframes exitPulse{50%{transform:translateX(6px) scale(1.12);opacity:.65}}
@keyframes sparkFly{from{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.35) rotate(var(--rot))}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes happyBirds{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}@keyframes happyWiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes titlePop{from{opacity:0;transform:scale(.4) rotate(-9deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes confettiFall{to{transform:translate(var(--fall),110vh) rotate(780deg);opacity:.3}}
@media(prefers-reduced-motion:reduce){.piece.bird,.piece.bird img,.exit,.rays,.celebrate-birds,.celebrate-birds img{animation:none!important}}
</style></head><body><main class="app"><h1>🌿 시마에나가의 숲길</h1><div class="sub">두 마리가 함께 집으로 돌아갈 수 있게 도와주세요</div><div class="stats"><span id="stage"></span><span id="moves"></span></div><div id="board" class="board"><div class="preview-fallback">게임을 불러오는 중입니다…<small>화면이 그대로라면 파일 미리보기 대신 웹사이트에서 실행해야 합니다.</small></div></div><div class="controls"><button id="undo">↶ 되돌리기</button><button id="reset">⟳ 다시 시작</button></div><div id="msg" class="message">통나무와 풀잎을 밀어 길을 열어주세요.</div><div id="win" class="win hidden">🌸 시마에나가 부부가 함께 탈출했어요!<br><button class="next" id="next">다음 숲길 →</button></div><div class="footer">시간 제한 없음 · 실패 없음 · 터치와 마우스 지원</div></main><script>

let audioCtx=null;
function sound(freq=500,dur=.09,type='sine',gain=.035){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime);g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);osc.connect(g).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+dur)}catch(e){}}
function sparkle(x,y,count=12,burst=false){const rect=board.getBoundingClientRect();for(let i=0;i<count;i++){let q=document.createElement('span');q.className='spark '+(i%3===0?'flower':'');q.textContent=i%3===0?'✿':i%3===1?'✦':'✧';q.style.left=x+'px';q.style.top=y+'px';q.style.setProperty('--dx',(Math.cos(i*2.399)*(burst?75:37)*(0.6+Math.random()))+'px');q.style.setProperty('--dy',(Math.sin(i*2.399)*(burst?85:40)*(0.6+Math.random()))+'px');q.style.setProperty('--rot',(Math.random()*360)+'deg');board.append(q);setTimeout(()=>q.remove(),950)}}
function load(){pieces=copy(layouts[level%layouts.length]);history=[];moves=0;won=false;celebrating=false;drag=null;overlay.classList.add('hidden');board.classList.remove('cleared');win.classList.add('hidden');msg.textContent='나뭇가지와 풀잎을 부드럽게 밀어주세요 ✨';draw(true)}
function occupied(except){const s=new Set();pieces.forEach(p=>{if(p.id===except)return;for(let k=0;k<p.n;k++)s.add(`${p.x+(p.d==='h'?k:0)},${p.y+(p.d==='v'?k:0)}`)});return s}
function valid(p,x,y){if(x<0||y<0||x+(p.d==='h'?p.n:1)>6||y+(p.d==='v'?p.n:1)>6)return false;const o=occupied(p.id);for(let k=0;k<p.n;k++)if(o.has(`${x+(p.d==='h'?k:0)},${y+(p.d==='v'?k:0)}`))return false;return true}
function move(id,delta,fromDrag=false){if(won||celebrating)return;const p=pieces.find(z=>z.id===id);if(!p)return;const sign=Math.sign(delta),steps=Math.abs(delta);let nx=p.x,ny=p.y;for(let k=0;k<steps;k++){const tx=nx+(p.d==='h'?sign:0),ty=ny+(p.d==='v'?sign:0);if(!valid(p,tx,ty))break;nx=tx;ny=ty}if(nx===p.x&&ny===p.y){sound(230,.055,'triangle',.016);const el=board.querySelector('[data-id="'+id+'"]');if(el){el.classList.remove('bump');void el.offsetWidth;el.classList.add(p.d==='v'?'bump-vertical':'bump')}return}history.push(copy(pieces));p.x=nx;p.y=ny;moves++;const el=board.querySelector('[data-id="'+id+'"]');if(el){if(fromDrag){el.style.transition='none'}el.style.left=(p.x*100/6)+'%';el.style.top=(p.y*100/6)+'%';el.classList.remove('moving');void el.offsetWidth;el.classList.add('moving');const px=(p.x+(p.d==='h'?p.n:1)/2)*board.clientWidth/6,py=(p.y+(p.d==='v'?p.n:1)/2)*board.clientWidth/6;sparkle(px,py,9);setTimeout(()=>el.classList.remove('moving'),430)}sound(p.t==='bird'?760:420+Math.random()*150,.11,'sine',.04);stageEl.textContent='숲길 '+(level+1);movesEl.textContent='이동 '+moves+'회';if(p.id==='bird'&&p.x===4){won=true;celebrating=true;setTimeout(celebrate,470)}}
function celebrate(){if(!won)return;const bird=board.querySelector('[data-id="bird"]');if(bird)bird.classList.add('escaping');sparkle(board.clientWidth*.87,board.clientWidth*.42,36,true);board.classList.add('cleared');msg.textContent='♡ 시마에나가 부부가 무사히 돌아왔어요!';sound(650,.18);setTimeout(()=>sound(880,.2),130);setTimeout(()=>sound(1100,.32),280);setTimeout(()=>{overlay.classList.remove('hidden');overlay.classList.remove('pop');void overlay.offsetWidth;overlay.classList.add('pop');celebrating=false;for(let i=0;i<34;i++){const c=document.createElement('i');c.className='confetti';c.style.left=(Math.random()*100)+'%';c.style.background=['#f6a7b5','#ffe49a','#a5d8b2','#b8c9fa','#f9c9e7'][i%5];c.style.animationDelay=(Math.random()*.8)+'s';c.style.setProperty('--fall',(Math.random()*140-70)+'px');overlay.append(c);setTimeout(()=>c.remove(),3000)}},650)}
function draw(initial=false){board.classList.remove('cleared');board.innerHTML='';for(let y=0;y<6;y++)for(let x=0;x<6;x++){const c=document.createElement('div');c.className='cell';c.style.left=x*100/6+'%';c.style.top=y*100/6+'%';board.append(c)}const ex=document.createElement('div');ex.className='exit';ex.innerHTML='✦ ➜';board.append(ex);pieces.forEach((p,i)=>{const el=document.createElement('div');el.className='piece '+p.t+(p.d==='v'?' vertical':'')+(initial?' spawn':'');el.dataset.id=p.id;el.style.setProperty('--delay',i*65+'ms');el.style.left=p.x*100/6+'%';el.style.top=p.y*100/6+'%';el.style.width=(p.d==='h'?p.n:1)*100/6+'%';el.style.height=(p.d==='v'?p.n:1)*100/6+'%';const img=document.createElement('img');img.src=art[p.t];img.alt=p.t==='bird'?'시마에나가 부부':p.t==='log'?'통나무':'풀잎';if(p.d==='v'){img.style.width=(p.n*100)+'%';img.style.height=(100/p.n)+'%';img.style.transform='translate(-50%,-50%) rotate(90deg)';img.style.left='50%';img.style.top='50%'}el.append(img);
el.addEventListener('pointerdown',e=>{
  if(won||celebrating||drag)return;
  e.preventDefault();
  try{el.setPointerCapture(e.pointerId)}catch(_){}
  const unit=board.clientWidth/6;
  let min=0,max=0;
  while(valid(p,p.x+(p.d==='h'?min-1:0),p.y+(p.d==='v'?min-1:0)))min--;
  while(valid(p,p.x+(p.d==='h'?max+1:0),p.y+(p.d==='v'?max+1:0)))max++;
  drag={id:p.id,pointerId:e.pointerId,start:p.d==='h'?e.clientX:e.clientY,unit,el,axis:p.d,min,max,offset:0};
  el.classList.add('held');
  el.style.transition='none';
  sound(360,.04,'sine',.012);
});
el.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==p.id||drag.pointerId!==e.pointerId)return;
  const distance=(p.d==='h'?e.clientX:e.clientY)-drag.start;
  const offset=Math.max(drag.min*drag.unit,Math.min(drag.max*drag.unit,distance));
  drag.offset=offset;
  el.style.setProperty('--dragx',p.d==='h'?offset+'px':'0px');
  el.style.setProperty('--dragy',p.d==='v'?offset+'px':'0px');
});
el.addEventListener('pointerup',e=>{
  if(!drag||drag.id!==p.id||drag.pointerId!==e.pointerId)return;
  const d=drag;drag=null;
  const distance=(p.d==='h'?e.clientX:e.clientY)-d.start;
  const bounded=Math.max(d.min*d.unit,Math.min(d.max*d.unit,distance));
  const step=Math.max(d.min,Math.min(d.max,Math.round(bounded/d.unit)));
  el.classList.remove('held');
  if(step){
    // Preserve the current visual position while the logical grid position changes.
    // This prevents a second left-to-right animation after finger release.
    const visualOffset=bounded-step*d.unit;
    el.style.setProperty('--dragx',p.d==='h'?visualOffset+'px':'0px');
    el.style.setProperty('--dragy',p.d==='v'?visualOffset+'px':'0px');
    move(p.id,step,true);
    el.style.setProperty('--dragx',p.d==='h'?visualOffset+'px':'0px');
    el.style.setProperty('--dragy',p.d==='v'?visualOffset+'px':'0px');
  }else{
    el.style.setProperty('--dragx',p.d==='h'?bounded+'px':'0px');
    el.style.setProperty('--dragy',p.d==='v'?bounded+'px':'0px');
  }
  // Animate only the small remaining snap distance, never the whole move again.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    el.style.transition='transform .16s ease-out,filter .16s';
    el.style.setProperty('--dragx','0px');
    el.style.setProperty('--dragy','0px');
    setTimeout(()=>{if(!drag||drag.el!==el)el.style.transition=''},190);
  }));
});
el.addEventListener('pointercancel',()=>{
  if(!drag||drag.id!==p.id)return;
  drag=null;el.classList.remove('held');
  el.style.setProperty('--dragx','0px');el.style.setProperty('--dragy','0px');
  el.style.transition='';
});board.append(el)});stageEl.textContent='숲길 '+(level+1);movesEl.textContent='이동 '+moves+'회'}
document.querySelector('#undo').onclick=()=>{if(!history.length||celebrating)return;pieces=history.pop();moves--;won=false;overlay.classList.add('hidden');msg.textContent='다시 천천히 해봐요 🌿';draw();sound(390,.08)};
document.querySelector('#reset').onclick=load;document.querySelector('#next').onclick=()=>{level++;load()};load();
</script></body></html>
